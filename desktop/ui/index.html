<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <script src="theme.js"></script>
  <style>
    :root {
      --bg-0: #07090f;
      --bg-1: #0b1020;
      --bg-top: #0f1630;
      --accent: #4d6bfe;
      --accent-2: #8aa2ff;
      --cyan: #5ecfff;
      --warm: #7c8cff;
      --fg: #e8ecf6;
      --muted: #8a96b3;
      --terminal-bg: rgba(9, 12, 24, 0.68);
      --terminal-border: rgba(100, 130, 220, 0.18);
    }
    /* Light theme — the same layout with a bright palette. */
    html[data-theme="light"] {
      --bg-0: #eef2fb;
      --bg-1: #e0e8f8;
      --bg-top: #d9e4fb;
      --accent: #3d5df0;
      --accent-2: #3a55c9;
      --cyan: #1689c4;
      --warm: #4a5fd0;
      --fg: #1b2440;
      --muted: #5b6688;
      --terminal-bg: rgba(255, 255, 255, 0.85);
      --terminal-border: rgba(70, 100, 190, 0.20);
    }
    html[data-theme="light"] .bg-base {
      background:
        radial-gradient(ellipse at top, var(--bg-top) 0%, var(--bg-0) 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    }
    html[data-theme="light"] .bg-glow-1 {
      background: radial-gradient(circle, rgba(120, 150, 225, 0.30) 0%, transparent 60%);
    }
    html[data-theme="light"] .bg-glow-2 {
      background: radial-gradient(ellipse at center, rgba(120, 150, 225, 0.25) 0%, rgba(120, 150, 225, 0.15) 40%, transparent 70%);
    }
    html[data-theme="light"] .bg-glow-3 {
      background: radial-gradient(circle, rgba(130, 155, 225, 0.22) 0%, rgba(120, 150, 225, 0.14) 30%, transparent 70%);
    }
    html[data-theme="light"] .bg-grid {
      background-image:
        linear-gradient(rgba(61, 93, 240, 0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61, 93, 240, 0.10) 1px, transparent 1px);
    }
    html[data-theme="light"] .bg-top-shine {
      background: radial-gradient(ellipse at center, rgba(90, 120, 230, 0.10) 0%, transparent 65%);
    }
    html[data-theme="light"] .brand h1 {
      background: linear-gradient(135deg, #22305c 0%, #3a55c9 60%, #2b46b8 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    html[data-theme="light"] .terminal {
      box-shadow:
        0 24px 80px rgba(30, 50, 120, 0.16),
        0 0 0 1px rgba(30, 50, 120, 0.04) inset,
        0 1px 0 rgba(255, 255, 255, 0.6) inset;
    }
    html[data-theme="light"] .terminal-header {
      background: rgba(0, 0, 0, 0.03);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    html[data-theme="light"] .terminal-body { color: #2a3558; }
    html[data-theme="light"] .log-line.stderr { color: #c63b3b; }
    html[data-theme="light"] .log-line.prefix { color: #3a55c9; }
    html[data-theme="light"] .log-line.ready {
      color: #0e9e6e;
      text-shadow: 0 0 10px rgba(14, 158, 110, 0.25);
    }
    html[data-theme="light"] .progress-bar { background: rgba(0, 0, 0, 0.08); }
    html[data-theme="light"] .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(90, 110, 180, 0.30);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--fg);
      -webkit-user-select: none; user-select: none;
      background: var(--bg-0);
    }

    /* ===== Layered cosmic background ===== */
    .bg { position: fixed; inset: 0; pointer-events: none; }
    .bg-base {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at top, var(--bg-top) 0%, var(--bg-0) 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    }
    /* Glow orbs — deep blue/cyan, soft and blurred */
    .bg-glow-1 {
      position: absolute;
      left: -10%; bottom: -20%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(26, 56, 112, 0.7) 0%, transparent 60%);
      filter: blur(80px);
      mix-blend-mode: screen;
      animation: float1 18s ease-in-out infinite alternate;
    }
    .bg-glow-2 {
      position: absolute;
      left: 50%; bottom: -15%;
      transform: translateX(-50%);
      width: 65vw; height: 40vw;
      background: radial-gradient(ellipse at center, rgba(45, 95, 158, 0.55) 0%, rgba(26, 56, 112, 0.4) 40%, transparent 70%);
      filter: blur(100px);
      mix-blend-mode: screen;
      animation: float2 22s ease-in-out infinite alternate;
    }
    .bg-glow-3 {
      position: absolute;
      right: -5%; bottom: -25%;
      width: 45vw; height: 45vw;
      background: radial-gradient(circle, rgba(74, 138, 196, 0.5) 0%, rgba(45, 95, 158, 0.35) 30%, transparent 70%);
      filter: blur(60px);
      mix-blend-mode: screen;
      animation: float3 20s ease-in-out infinite alternate;
    }
    @keyframes float1 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, -8%) scale(1.08); }
    }
    @keyframes float2 {
      0%   { transform: translateX(-50%) translateY(0) scale(1); }
      100% { transform: translateX(-46%) translateY(-5%) scale(1.05); }
    }
    @keyframes float3 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-6%, -6%) scale(1.1); }
    }

    /* Subtle grid */
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(77, 107, 254, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77, 107, 254, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 60%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 60%, black 30%, transparent 75%);
    }

    /* Particle canvas */
    #particle-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      mask-image:
        linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%),
        linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      mask-composite: intersect;
      -webkit-mask-image:
        linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%),
        linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-composite: source-in;
      opacity: 0.75;
    }

    /* Top vignette highlight */
    .bg-top-shine {
      position: absolute;
      top: -20%; left: 50%;
      transform: translateX(-50%);
      width: 80vw; height: 50vh;
      background: radial-gradient(ellipse at center, rgba(100, 140, 255, 0.12) 0%, transparent 65%);
      filter: blur(40px);
    }

    /* ===== Main layout ===== */
    .wrap {
      position: relative;
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 48px 48px;
      gap: 24px;
    }

    .brand {
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-2), #1f3bb3);
      display: flex; align-items: center; justify-content: center;
      box-shadow:
        0 10px 40px rgba(77, 107, 254, 0.5),
        0 0 0 1px rgba(255,255,255,0.08) inset,
        inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .logo svg { width: 42px; height: 42px; }
    .brand h1 {
      font-size: 26px; font-weight: 600;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #fff 0%, #b8c8ff 60%, var(--accent-2) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p.sub {
      font-size: 13px; color: var(--muted);
    }

    .status-line {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--muted);
    }
    .pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(77, 107, 254, 0.7);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(77, 107, 254, 0.6); }
      70%  { box-shadow: 0 0 0 14px rgba(77, 107, 254, 0); }
      100% { box-shadow: 0 0 0 0 rgba(77, 107, 254, 0); }
    }
    .pulse.error {
      background: #ff7070;
      box-shadow: 0 0 0 0 rgba(255, 112, 112, 0.7);
      animation: pulse-error 1.8s ease-out infinite;
    }
    @keyframes pulse-error {
      0%   { box-shadow: 0 0 0 0 rgba(255, 112, 112, 0.6); }
      70%  { box-shadow: 0 0 0 14px rgba(255, 112, 112, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 112, 112, 0); }
    }

    /* ===== Terminal window ===== */
    .terminal {
      width: 100%;
      max-width: 760px;
      background: var(--terminal-bg);
      border: 1px solid var(--terminal-border);
      border-radius: 14px;
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 1px 0 rgba(255,255,255,0.06) inset;
      overflow: hidden;
    }
    .terminal-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.025);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 11.5px;
      color: var(--muted);
      -webkit-user-select: none; user-select: none;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .terminal-title {
      flex: 1; text-align: center;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.3px;
    }
    .terminal-body {
      padding: 14px 16px;
      max-height: 280px;
      overflow-y: auto;
      font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.65;
      color: #c8d4f0;
      scroll-behavior: smooth;
    }
    .terminal-body::-webkit-scrollbar { width: 6px; }
    .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(120, 140, 200, 0.25); border-radius: 3px;
    }
    .log-line {
      white-space: pre-wrap;
      word-break: break-all;
      animation: lineIn 0.3s ease-out;
    }
    @keyframes lineIn {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .log-line.stderr { color: #ff9090; }
    .log-line.prefix { color: #7ea2ff; }
    .log-line.ready  {
      color: #5eeac0;
      font-weight: 500;
      text-shadow: 0 0 10px rgba(94, 234, 192, 0.3);
    }
    .log-line.info   { color: var(--accent-2); }

    /* Progress bar for Node download */
    .progress-wrap {
      display: none;
      padding: 0 16px 14px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--muted);
    }
    .progress-wrap.visible { display: block; }
    .progress-bar {
      width: 100%; height: 4px;
      margin-top: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      border-radius: 2px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(77, 107, 254, 0.5);
    }
    .progress-text {
      display: flex; justify-content: space-between;
      margin-top: 6px;
    }

    /* ===== Settings (gear) button ===== */
    .settings-btn {
      position: fixed;
      top: 18px; right: 18px;
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--terminal-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.1s ease;
      z-index: 20;
    }
    .settings-btn svg { width: 18px; height: 18px; }
    .settings-btn:hover {
      color: var(--fg);
      border-color: var(--accent);
      background: rgba(77, 107, 254, 0.12);
    }
    .settings-btn:active { transform: scale(0.94); }
    html[data-theme="light"] .settings-btn {
      background: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <div class="bg-glow-3"></div>

  <div class="wrap">

      <div class="logo">
        <svg viewBox="0 0 50 50" fill="none" aria-hidden="true">
          <path fill="#fff" d="M48.8354 10.0479C48.3232 9.79199 48.1025 10.2798 47.8032 10.5278C47.7007 10.6079 47.6143 10.7119 47.5273 10.8076C46.7793 11.624 45.9048 12.1597 44.7622 12.0957C43.0923 12 41.666 12.5356 40.4058 13.8398C40.1377 12.2319 39.2476 11.272 37.8926 10.6558C37.1836 10.3359 36.4668 10.0156 35.9702 9.31982C35.6235 8.82373 35.5293 8.27197 35.356 7.72754C35.2456 7.3999 35.1353 7.06396 34.7651 7.00781C34.3633 6.94385 34.2056 7.2876 34.0479 7.57568C33.418 8.75195 33.1733 10.0479 33.1973 11.3599C33.2524 14.312 34.4736 16.6641 36.8999 18.3359C37.1758 18.5278 37.2466 18.7197 37.1597 19C36.9946 19.5757 36.7974 20.1357 36.624 20.7119C36.5137 21.0801 36.3486 21.1597 35.9624 21C34.6309 20.4321 33.481 19.5918 32.4644 18.5757C30.7393 16.8721 29.1792 14.9917 27.2334 13.52C26.7764 13.1758 26.3193 12.856 25.8467 12.5518C23.8618 10.584 26.1069 8.96777 26.627 8.77588C27.1704 8.57568 26.8159 7.8877 25.0591 7.896C23.3022 7.90381 21.6953 8.50391 19.647 9.30371C19.3477 9.42383 19.0322 9.51172 18.7095 9.58398C16.8501 9.22363 14.9199 9.14355 12.9033 9.37598C9.10596 9.80762 6.07275 11.6396 3.84326 14.7681C1.16455 18.5278 0.53418 22.7998 1.30664 27.2559C2.11768 31.9521 4.46582 35.8398 8.07373 38.8799C11.8159 42.0322 16.1255 43.5762 21.041 43.2803C24.0269 43.104 27.3516 42.6963 31.1016 39.4561C32.0469 39.936 33.0396 40.1279 34.686 40.272C35.9546 40.3921 37.1758 40.208 38.1211 40.0078C39.6021 39.688 39.4995 38.2881 38.9639 38.0322C34.623 35.9678 35.5762 36.8081 34.71 36.1279C36.9155 33.4639 40.2402 30.6958 41.54 21.728C41.6426 21.0161 41.5557 20.5679 41.54 19.9917C41.5322 19.6396 41.6108 19.5039 42.0049 19.4639C43.0923 19.3359 44.1479 19.0317 45.1167 18.4878C47.9292 16.9199 49.064 14.3438 49.3315 11.2559C49.3711 10.7837 49.3237 10.2959 48.8354 10.0479ZM24.3262 37.8398C20.1196 34.4639 18.0791 33.3521 17.2358 33.3999C16.4482 33.4482 16.5898 34.3682 16.7632 34.9678C16.9443 35.5601 17.1812 35.9683 17.5117 36.4878C17.7402 36.832 17.8979 37.3442 17.2832 37.728C15.9282 38.584 13.5     <div class="status-line">
      <div class="pulse" id="pulse"></div>

    <div class="terminal">

  <script>
    // ===== Particle system (官網風格的 canvas 粒子) =====
    (function () {
      var canvas = document.getElementById('particle-canvas');
      var ctx = canvas.getContext('2d');
      var DPR = window.devicePixelRatio || 1;
      var particles = [];
      var w = 0, h = 0;

      function resize() {
        w = canvas.clientWidth = window.innerWidth;
        h = canvas.clientHeight = window.innerHeight;
        canvas.width = w * DPR;
        canvas.height = h * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      function spawn() {
        var count = Math.min(90, Math.floor((w * h) / 16000));
        particles = [];
        for (var i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.25,
            r: Math.random() * 1.4 + 0.4,
            a: Math.random() * 0.5 + 0.3
          });
        }
      }
      spawn();
      window.addEventListener('resize', spawn);

      function draw() {
        var isLight = (document.documentElement.dataset.theme || 'dark') === 'light';
        var lineRGB = isLight ? '90,120,210' : '120,150,230';
        var dotRGB = isLight ? '80,110,200' : '150,180,255';
        ctx.clearRect(0, 0, w, h);

        // Connection lines
        for (var i = 0; i < particles.length; i++) {
          var p1 = particles[i];
          for (var j = i + 1; j < particles.length; j++) {
            var p2 = particles[j];
            var dx = p1.x - p2.x;
            var dy = p1.y - p2.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 130) {
              var alpha = (1 - dist / 130) * 0.25;
              ctx.strokeStyle = 'rgba(' + lineRGB + ', ' + alpha + ')';
              ctx.lineWidth = 0.6;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }

        // Particles
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + dotRGB + ', ' + p.a + ')';
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ===== Log & status helpers =====
    (function () {
      var logEl = document.getElementById('log');
      var statusEl = document.getElementById('statusText');
      var pulseEl = document.getElementById('pulse');
      var progressWrap = document.getElementById('progressWrap');
      var progressFill = document.getElementById('progressFill');
      var progressPct = document.getElementById('progressPct');
      var progressSize = document.getElementById('progressSize');
      var progressLabel = document.getElementById('progressLabel');
      var maxLines = 300;
      var lineCount = 0;
      var atBottom = true;

      function appendLine(text, isStderr) {
        var div = document.createElement('div');
        div.className = 'log-line' + (isStderr ? ' stderr' : '');
        if (text.indexOf('dsh web: http://') !== -1) div.classList.add('ready');
        if (text.indexOf('[info]') === 0) div.classList.add('info');
        div.textContent = text;
        logEl.appendChild(div);
        lineCount++;
        while (lineCount > maxLines) {
          if (logEl.firstChild) { logEl.removeChild(logEl.firstChild); lineCount--; }
        }
        if (atBottom) logEl.scrollTop = logEl.scrollHeight;
      }

      logEl.addEventListener('scroll', function () {
        var threshold = 8;
        atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < threshold;
      });

      // Hook: overall status text
      window.__dshStatus = function (message, isError) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? '#ff9090' : '';
        pulseEl.classList.toggle('error', !!isError);
        if (isError) appendLine('[error] ' + message, true);
      };

      // Hook: live log lines from Rust launcher
      window.__dshAppendLog = function (line, isStderr) {
        appendLine(String(line || ''), !!isStderr);
      };

      // Hook: download progress (bytes_total may be 0 if unknown)
      window.__dshDownloadProgress = function (bytes_done, bytes_total, label) {
        progressWrap.classList.add('visible');
        if (label) progressLabel.textContent = label;
        if (bytes_total > 0) {
          var pct = Math.round((bytes_done / bytes_total) * 100);
          progressFill.style.width = pct + '%';
          progressPct.textContent = pct + '%';
          var doneMb = (bytes_done / 1024 / 1024).toFixed(1);
          var totalMb = (bytes_total / 1024 / 1024).toFixed(1);
          progressSize.textContent = doneMb + ' MB / ' + totalMb + ' MB';
        } else {
          var doneMb = (bytes_done / 1024 / 1024).toFixed(1);
          progressPct.textContent = '—';
          progressSize.textContent = doneMb + ' MB / — MB';
        }
      };

      // Welcome line
      appendLine('$ dsh local runtime', false);
      appendLine('// 正在检查本机环境，准备启动 dsh web 服务…', false);

      // Expose for other scopes (settings button error reporting).
      window.__dshAppendLine = appendLine;
    })();

    // ===== Settings button =====
    (function () {
      var btn = document.getElementById('settingsBtn');
      btn.addEventListener('click', function () {
        if (window.__TAURI__) {
          window.__TAURI__.core.invoke('open_settings_window').catch(function (err) {
            if (window.__dshAppendLine) window.__dshAppendLine('[error] 打开设置失败: ' + err, true);
          });
        }
      });
    })();
  </script>
</body>
</html>
