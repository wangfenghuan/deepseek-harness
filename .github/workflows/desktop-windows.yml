name: Windows Desktop App

# Builds the lightweight Tauri launcher ("DeepSeek Harness.exe") for Windows x64.
# The launcher spawns `npx @deepseek-ai/dsh web` as a child process and loads
# the served URL in a WebView2 window; see desktop/README.md for the design.
#
# Runs on every push to the default branch, on version tags (also publishing a
# GitHub Release with the installer), and manually via workflow_dispatch.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows app (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare PNG icon from .ico
        # Tauri requires at least one PNG icon at build time (used internally
        # and for Linux). We extract the largest PNG from the committed .ico
        # using .NET System.Drawing.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop/src-tauri/icons -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "desktop/assets/app-ico.ico").Path)
          # ico files can contain multiple sizes; iterate to find the largest.
          $sizes = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "desktop/assets/app-ico.ico").Path)
          # Use the Bitmap from the Icon and save as PNG.
          $bmp = $ico.ToBitmap()
          $bmp.Save("desktop/src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          $ico.Dispose()

      - name: Build the desktop app
        working-directory: desktop
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build

      - name: Report artifact sizes
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse -File |
            ForEach-Object {
              $sizeMb = [math]::Round($_.Length / 1MB, 1)
              Write-Output "  $($_.FullName)  ($sizeMb MB)"
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: deepseek-harness-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
