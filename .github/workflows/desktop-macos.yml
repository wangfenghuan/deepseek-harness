name: macOS Desktop App

# Builds the lightweight Tauri launcher ("DeepSeek Harness.app") on Apple
# Silicon. The launcher spawns `npx @deepseek-ai/dsh web` as a child process and
# loads the served URL in a WebView; see desktop/README.md for the design.
#
# Runs on every push to the default branch, on version tags (also publishing a
# GitHub Release with the .dmg), and manually via workflow_dispatch.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate app icons
        # Rasterize the committed SVG with resvg-js, then emit every platform
        # icon (icns/png/ico) into desktop/src-tauri/icons. resvg-js is a library,
        # not a CLI, so we install it into a temp dir and run the script from
        # there so `require()` can find it.
        run: |
          ICON_DIR="$(mktemp -d)"
          cd "$ICON_DIR"
          npm init -y >/dev/null
          npm install --silent @resvg/resvg-js@2
          node -e "
            const { Resvg } = require('@resvg/resvg-js');
            const fs = require('fs');
            const svg = fs.readFileSync(process.env.SVG_PATH, 'utf8');
            const png = new Resvg(svg, { fitTo: { mode: 'width', value: 1024 } }).render().asPng();
            fs.writeFileSync(process.env.PNG_PATH, png);
          "
          cd "$GITHUB_WORKSPACE"
          npx --yes @tauri-apps/cli@2 icon desktop/assets/app-icon-1024.png -o desktop/src-tauri/icons
        env:
          SVG_PATH: ${{ github.workspace }}/desktop/assets/app-icon.svg
          PNG_PATH: ${{ github.workspace }}/desktop/assets/app-icon-1024.png

      - name: Build the desktop app
        env:
          TAURI_SIGNING_IDENTITY: '-'
          DSH_TELEMETRY_DISABLED: '1'
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build

      - name: Report artifact sizes
        run: |
          du -sh desktop/src-tauri/target/release/bundle/macos/*.app | sed 's/^/  /'
          du -sh desktop/src-tauri/target/release/bundle/dmg/*.dmg | sed 's/^/  /'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
