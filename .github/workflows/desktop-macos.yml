name: macOS Desktop App

# Builds the lightweight Tauri launcher ("DeepSeek Harness.app") on Apple
# Silicon. The launcher spawns `npx @deepseek-ai/dsh web` as a child process and
# loads the served URL in a WebView; see desktop/README.md for the design.
#
# Runs on every push to the default branch, on version tags (also publishing a
# GitHub Release with the .dmg), and manually via workflow_dispatch.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare PNG icon from .icns
        # Tauri requires at least one PNG icon at build time (used internally
        # and for Linux). We extract the largest PNG from the committed .icns
        # using the system iconutil tool.
        run: |
          mkdir -p desktop/src-tauri/icons
          ICONSET="$(mktemp -d)/app.iconset"
          iconutil -c iconset desktop/assets/app-icns.icns -o "$(dirname "$ICONSET")"
          # Find the largest PNG in the iconset and copy it as the base icon.
          LARGEST=$(ls "$ICONSET"/icon_*.png | sort -t_ -k2 -n | tail -1)
          cp "$LARGEST" desktop/src-tauri/icons/icon.png

      - name: Build the desktop app
        env:
          TAURI_SIGNING_IDENTITY: '-'
          DSH_TELEMETRY_DISABLED: '1'
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build

      - name: Report artifact sizes
        run: |
          du -sh desktop/src-tauri/target/release/bundle/macos/*.app | sed 's/^/  /'
          du -sh desktop/src-tauri/target/release/bundle/dmg/*.dmg | sed 's/^/  /'

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: deepseek-harness-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
